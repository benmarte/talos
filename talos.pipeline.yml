# Talos dogfood config — Talos running its own backlog.
# Guardrails for self-modification: verify runs the full offline suite, CI
# checks are required before merge, one issue at a time.

base_branch: main

vcs:
  provider: github

board:
  enabled: true
  project_number: 4
  owner: benmarte

issues:
  label_filter: "pipeline:ready"
  skip_labels:
    - "pipeline:blocked"
    - "wontfix"
  max_parallel: 1

roles:
  validator: true
  pm: true
  qa: true
  reviewer: true
  security: true
  docs: true

# Every PR must keep the whole suite green before QA signs off…
verify:
  - "bash tests/run-tests.sh"

# …and CI must confirm it on both platforms before merge.
merge:
  method: squash
  required_checks:
    - "test (ubuntu-latest)"
    - "test (macos-latest)"
  delete_branch: true
  # approval_waiver_paths — glob patterns for files whose presence in a
  # post-approval delta does NOT invalidate existing approvals (docs-only rule).
  # HARD-CODED non-waivable (always blocked regardless of this list):
  #   scripts/**   tests/**   talos.pipeline.yml   pipeline.yaml
  # These are enforced structurally and cannot be overridden by config.
  # Default used when this key is absent: ["*.md", "docs/**", "CHANGELOG.md"]
  approval_waiver_paths:
    - "*.md"
    - "docs/**"
    - "CHANGELOG.md"

limits:
  # max_fix_attempts: max consecutive per-stage failures before pipeline:blocked.
  # Semantics changed in #56: counts consecutive failures of the SAME blocking
  # stage; resets when the blocking stage changes. (Was: all-time dispatch count.)
  max_fix_attempts: 3
  # max_total_dispatches: absolute ceiling on developer dispatches per issue,
  # never resets on stage change. Prevents QA↔reviewer ping-pong exhausting
  # no per-stage budget. Enforced by `record-attempt` / `check-attempt`.
  max_total_dispatches: 8
