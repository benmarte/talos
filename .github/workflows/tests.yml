# Dogfoods templates/ci/github-tests.yml (#260) -- see that file for the
# full explanation of paths-ignore and concurrency. Keep this file and the
# template in sync, except for the sharding below (#556), which only this
# repo's tests/run-tests.sh supports, and macOS, which differs on purpose:
# the template keeps macOS on push to the base branch because a target repo
# has no canary and its `test` matrix jobs are independent, so
# `test (ubuntu-latest)` never waits for macOS there. Here `test` needs every
# shard, so a macOS shard (830-1,380 s each) would hold the one required check
# on every push to main and every merge-queue candidate. No job in this file
# runs on macOS: the nightly canary (canary.yml, job `macos`) runs the full
# suite there instead, so macOS drift is caught the next night (#970).
#
# Layout: the suite runs as 4 time-balanced shards (`run-tests.sh --shard i/n`,
# weights in tests/timings.txt) in parallel, plus a tiny `count` job for the
# base-ref test-file count check (once, not per shard), plus `workflow-lint`
# (actionlint on every workflow file and CI template, #1006). The final job `test`
# needs all of them and is the ONLY required status: its check name stays
# "test (ubuntu-latest)", exactly what talos.pipeline.json merge.required_checks
# and branch protection name, so the merge gate needs no change.

name: tests

on:
  push:
    # talos/queue/** : the merge queue's candidate branches (queue mode talos, see
    # docs/reference.md); the required check must run on them or every candidate times out.
    branches: [main, 'talos/queue/**']
    # No paths-ignore on push (#1010): it cannot be scoped to main only, and a
    # Markdown-only queue candidate must still run the required check.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft == true && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The base-ref count check: a test file that exists on the base branch but not
  # here fails the run unless tests/retired-tests.txt names it. Shards skip it.
  count:
    # Skip CI on draft PRs -- developers iterate freely on drafts and mark
    # ready-for-review only once every stage has approved. This yields one
    # CI run per PR on the final SHA, immediately before merge.
    # IMPORTANT: ready_for_review must be in types above -- without it,
    # marking a draft ready fires no event and CI never runs for drafted PRs.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Depth 2 so a pull_request run has the merge commit's base parent (HEAD^1).
          fetch-depth: 2
      # pull_request: the checkout is GitHub's merge commit, built from the base as it
      # was when the PR event fired. HEAD^1 is that base, so a test file another PR
      # merged to the base since cannot read as missing (#996). A PR that deletes a
      # base test file still fails: the merge commit lacks it and HEAD^1 has it.
      - name: Check no test file went missing (against the merge commit's base)
        if: github.event_name == 'pull_request'
        run: bash tests/run-tests.sh --count-only --base-ref HEAD^1
      # push (main, talos/queue/**): compare against the base branch as it is now.
      - name: Fetch the base branch
        if: github.event_name != 'pull_request'
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
      - name: Check no test file went missing
        if: github.event_name != 'pull_request'
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: bash tests/run-tests.sh --count-only --base-ref "origin/${BASE}"

  # Lints every workflow file and CI template with a pinned actionlint (#1006). GitHub
  # refuses to start a workflow with a syntax error (0 jobs, the required check never
  # appears), so QA only saw a timeout; nothing else validates these files in CI
  # (the YAML checks in test-ci-tests-workflow.sh need a library CI does not install).
  # tests/test-workflow-lint.sh runs the same lint locally when actionlint is on PATH.
  # Keep the -ignore regex in step with LINT_IGNORE there: SC2016 is shellcheck info,
  # used on purpose by timings.yml.
  workflow-lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: '1.7.12'
    steps:
      - uses: actions/checkout@v4
      # The release's own checksums file, from the pinned tag, must match the tarball.
      - name: Install actionlint (pinned version, checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Lint the workflow files and CI templates
        run: actionlint -ignore 'SC2016' .github/workflows/*.yml templates/ci/*.yml

  shard:
    if: github.event.pull_request.draft != true
    name: shard ${{ matrix.shard }} (${{ matrix.os }})
    strategy:
      # Let every shard finish: a red shard should still report its own failures.
      fail-fast: false
      matrix:
        # ubuntu-latest only, on every event (PR, push to main, merge-queue candidate).
        os: ['ubuntu-latest']
        shard: ['1/4', '2/4', '3/4', '4/4']
    # A hung test must cost half an hour, not GitHub's 6-hour default (#479). A shard takes a few minutes.
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    env:
      # Keep in step with the workflow-lint job: tests/test-workflow-lint.sh runs in a
      # shard and, under CI, fails when actionlint is not on PATH (it must not skip there).
      ACTIONLINT_VERSION: '1.7.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A PR checks out the merge commit; depth 2 holds its first parent,
          # HEAD^1, the base the PR is diffed against (#972).
          fetch-depth: 2
      - name: Install actionlint (pinned version, checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      # --timings: each shard log carries a TIMINGS block, the input for refitting tests/timings.txt.
      # A PR runs only the tests its changes select. That is safe here because nothing
      # merges without a full run: the Talos merge queue (docs/reference.md) runs the whole
      # suite on every talos/queue/** candidate and every push to main runs it again, so a
      # test a PR run missed fails at the candidate and the queue ejects the PR (#972).
      - name: "Run test shard (PR: the tests the changes select)"
        if: github.event_name == 'pull_request'
        run: bash tests/run-tests.sh --no-cache --quiet --timings --changed HEAD^1 --shard ${{ matrix.shard }}
      - name: Run test shard (full suite)
        if: github.event_name != 'pull_request'
        run: bash tests/run-tests.sh --no-cache --quiet --timings --shard ${{ matrix.shard }}

  # The one required status. It exists so the check name "test (ubuntu-latest)"
  # is stable: it passes only when the count check and every shard passed, and
  # fails on any failure or cancellation. always() makes it report even when a
  # needed job failed (a skipped aggregator would read as a pass to the gate).
  test:
    needs: [count, shard, workflow-lint]
    if: always() && github.event.pull_request.draft != true
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard, the count check and the workflow lint
        env:
          COUNT: ${{ needs.count.result }}
          SHARDS: ${{ needs.shard.result }}
          LINT: ${{ needs.workflow-lint.result }}
        run: |
          echo "count check: $COUNT; shards: $SHARDS; workflow lint: $LINT"
          [ "$COUNT" = success ] && [ "$SHARDS" = success ] && [ "$LINT" = success ]
