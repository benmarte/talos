# Dogfoods templates/ci/github-tests.yml (#260) -- see that file for the
# full explanation of paths-ignore, concurrency, and the PR-vs-push matrix
# split. Keep this file and the template in sync.

name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Skip CI on draft PRs — developers iterate freely on drafts and mark
    # ready-for-review only once every stage has approved. This yields one
    # CI run per PR on the final SHA, immediately before merge.
    # IMPORTANT: ready_for_review must be in types above — without it,
    # marking a draft ready fires no event and CI never runs for drafted PRs.
    # NOTE: != true is used rather than == false; both are behaviourally
    # identical under GHA numeric coercion, but != true states the intent.
    # NOTE: if required status checks are ever added for merge, a no-op job
    # matching "test (ubuntu-latest)" and "test (macos-latest)" that always
    # passes will be needed, or markdown-only PRs will hang "expected — waiting".
    if: github.event.pull_request.draft != true
    strategy:
      matrix:
        # PR pushes: ubuntu-latest only. Push to main: the full matrix. See
        # templates/ci/github-tests.yml's header for the merge.required_checks
        # caveat this implies (only "test (ubuntu-latest)" is PR-safe to name).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: bash tests/run-tests.sh --no-cache
