name: canary

on:
  schedule:
    # Nightly, 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

# One canary run at a time -- a second nightly firing (or a manual dispatch)
# while one is still touching the sandbox repo would race on issue/PR/branch
# numbers. Queue rather than cancel: an in-flight run's cleanup must finish.
concurrency:
  group: canary-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Roadmap 3.4: exercise tests/run-tests.sh's base-ref resolution, base-currency
  # warning and count check in CI -- today they only ever run locally, where it
  # is easy to never trigger. --count-only skips the suite: on a checkout of
  # main against origin/main there is nothing to compare, and the push to main
  # already ran the full suite (#970).
  base-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch origin/main
        run: git fetch origin main
      - name: Base-currency check
        run: bash tests/run-tests.sh --count-only --base-ref origin/main

  # The full suite on macOS, nightly. tests.yml runs ubuntu only, so the required
  # `test (ubuntu-latest)` check never waits on a macOS shard (830-1,380 s each);
  # macOS drift is caught here, the next night, instead of on the push (#970).
  macos:
    name: macos shard ${{ matrix.shard }}
    strategy:
      # Let every shard finish: a red shard should still report its own failures.
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    # A hung test must cost half an hour, not GitHub's 6-hour default.
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run test shard
        run: bash tests/run-tests.sh --no-cache --quiet --shard ${{ matrix.shard }}

  # Roadmap 3.3: a real gh/REST run against a dedicated sandbox repo, so
  # schema drift in GitHub's responses or gh CLI output fails here instead of
  # in production. Every test in tests/ stubs gh/curl/glab/az -- this is the
  # one job that doesn't.
  real-api:
    # Secrets aren't readable in a job-level `if`, so this only gates on the
    # (non-secret) repo variable; tests/canary/run.sh's own guard covers the
    # token and prints a skip notice + exits 0 when either is missing.
    if: ${{ vars.TALOS_CANARY_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run canary
        env:
          TALOS_CANARY_REPO: ${{ vars.TALOS_CANARY_REPO }}
          GH_TOKEN: ${{ secrets.TALOS_CANARY_TOKEN }}
          TALOS_GITHUB_TOKEN: ${{ secrets.TALOS_CANARY_TOKEN }}
        run: bash tests/canary/run.sh
